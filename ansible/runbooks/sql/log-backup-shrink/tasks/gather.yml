- name: Read the database log state
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', rb_dir ~ '/tasks/gather.ps1') }}"
    parameters:
      Instance: "{{ rb_sql_instance }}"
      Database: "{{ rb_database }}"
      BackupPath: "{{ rb_backup_path | default('') }}"
  changed_when: false
  register: rb_gather

- name: Keep the facts the decision uses
  ansible.builtin.set_fact:
    rb_facts: "{{ rb_gather.output[0] }}"
