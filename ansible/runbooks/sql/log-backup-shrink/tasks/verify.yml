- name: Read the log state again
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', rb_dir ~ '/tasks/gather.ps1') }}"
    parameters:
      Instance: "{{ rb_sql_instance }}"
      Database: "{{ rb_database }}"
  changed_when: false
  register: rb_verify

- name: Keep the after state
  ansible.builtin.set_fact:
    rb_after: "{{ rb_verify.output[0] }}"

- name: Check the log was freed
  ansible.builtin.assert:
    that:
      - (rb_after.log_used_pct | float) < (rb_facts.log_used_pct | float) or (rb_after.log_used_pct | float) < 50
    fail_msg: "Log use did not drop ({{ rb_facts.log_used_pct }}% before, {{ rb_after.log_used_pct }}% after)."
